
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autonomous-qa-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: autonomous-qa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
